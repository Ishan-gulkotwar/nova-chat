[project]
name = "nova-chat-backend"
version = "0.1.0"
description = "FastAPI backend for Nova Chat, a self-hosted AI chat app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",  # required by FastAPI's TestClient
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Starlette nudges toward a newer HTTP client for TestClient; httpx works fine.
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]
