[project]
name = "nova-chat-backend"
version = "0.3.0"
description = "FastAPI backend for Nova Chat, a self-hosted AI chat app"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.28",  # async HTTP client used to call LLM providers
    "sqlmodel>=0.0.22",  # ORM: SQLAlchemy + Pydantic models in one class
    "sqlalchemy[asyncio]>=2.0",  # async engine support (pulls in greenlet)
    "aiosqlite>=0.20",  # async SQLite driver for local development
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",  # lets tests be `async def`
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Starlette nudges toward a newer HTTP client for TestClient; httpx works fine.
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]
